$kind: http-request
method: DELETE
url: '{{baseUrl}}/orders/{{orderId}}/'
order: 6000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204 No Content", function () {
        pm.response.to.have.status(204);
      });
